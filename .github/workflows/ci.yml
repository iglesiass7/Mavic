# Integración continua: en cada push y en cada pull request se verifica que el
# código esté bien formateado, tipado, respete la arquitectura y pase los tests.
# Si algo falla, GitHub marca el commit con una cruz roja.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # Si llega un push nuevo a la misma rama, se cancela la corrida vieja.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python)
    # Versión fija: si GitHub cambia "ubuntu-latest" a otra versión, no nos toma por sorpresa.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend

    services:
      # Una base PostgreSQL real para los tests, igual que en docker compose.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mavic
          POSTGRES_PASSWORD: mavic
          POSTGRES_DB: mavic_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mavic -d mavic_test"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      CI: "true"
      DATABASE_URL: postgresql+psycopg://mavic:mavic@localhost:5432/mavic_test
      TEST_DATABASE_URL: postgresql+psycopg://mavic:mavic@localhost:5432/mavic_test

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Instalar dependencias
        run: pip install -e ".[dev]"

      - name: Formato (ruff format)
        run: ruff format --check .

      - name: Lint (ruff check)
        run: ruff check .

      - name: Tipado (mypy)
        run: mypy

      - name: Reglas de arquitectura (import-linter)
        run: lint-imports

      - name: Migraciones (subir, bajar y volver a subir)
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Modelos y migraciones coinciden (alembic check)
        # Falla si alguien cambió un modelo y se olvidó de crear la migración.
        run: alembic check

      - name: Tests
        run: pytest --cov=mavic --cov-report=term-missing

  frontend:
    name: Frontend (Next.js)
    # Versión fija: si GitHub cambia "ubuntu-latest" a otra versión, no nos toma por sorpresa.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend

    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias (versiones exactas del package-lock)
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint -- --max-warnings 0

      - name: Tipado (TypeScript)
        run: npm run typecheck

      - name: Tests (Vitest)
        run: npm test

      - name: Compilación (next build)
        # Si compila acá, compila en la imagen de Docker.
        run: npm run build
