[project]
name = "mavic"
version = "0.1.0"
description = "Backend de Mavic: gestión de cobranzas con agente de voz."
requires-python = ">=3.12"
# Versiones exactas: la misma versión en tu PC, en Docker y en CI.
# Para actualizar una librería se cambia acá, se corren los tests y se commitea.
dependencies = [
    "fastapi==0.143.3",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy==2.1.4",
    "psycopg[binary]==3.3.6",
    "alembic==1.20.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "argon2-cffi==25.1.0",
    "email-validator==2.3.0",
    "openpyxl==3.1.5",
    "phonenumbers==9.0.41",
    "python-multipart==0.0.32",
    "elevenlabs==2.74.1",  # SDK oficial: llamadas salientes por Twilio (ADR-034)
]

[project.optional-dependencies]
# Solo para desarrollo y CI: no viajan a la imagen de producción.
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "httpx2==2.13.1",  # cliente HTTP que usa el TestClient de FastAPI
    "ruff==0.17.1",
    "mypy==2.4.0",
    "import-linter==2.15",
    "types-openpyxl==3.1.5.20260827",  # tipos de openpyxl para mypy
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mavic"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
# --doctest-modules: los ejemplos ">>>" de los docstrings también se ejecutan como tests.
testpaths = ["tests", "src/mavic"]
addopts = "-ra --strict-markers --doctest-modules"
markers = [
    "db: el test necesita una base PostgreSQL real",
]

# ---------------------------------------------------------------- ruff
# Ruff hace dos trabajos: formatear (como black) y detectar errores (lint).
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # estilo PEP 8
    "F",        # errores reales: variables sin usar, imports rotos
    "I",        # orden de imports
    "B",        # bugs frecuentes (bugbear)
    "UP",       # sintaxis moderna de Python
    "SIM",      # simplificaciones
    "N",        # convenciones de nombres
    "S",        # seguridad (bandit)
    "ASYNC",    # errores con async/await
]

[tool.ruff.lint.per-file-ignores]
# En los tests usar assert es lo normal, y las contraseñas son de prueba.
"tests/**" = ["S101", "S105", "S106"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src", "tests"]

# ---------------------------------------------------------------- import-linter
# Contratos de arquitectura que se verifican en CI. Si alguien importa algo que
# rompe una regla de capas, el build falla. Se agregan contratos por módulo a
# medida que los módulos existan.
[tool.importlinter]
root_package = "mavic"
# Permite escribir contratos que mencionan librerías externas (fastapi, sqlalchemy...).
include_external_packages = true

[[tool.importlinter.contracts]]
name = "El núcleo no depende de la API ni de los módulos de negocio"
type = "forbidden"
source_modules = ["mavic.core"]
forbidden_modules = ["mavic.api", "mavic.modules"]

[[tool.importlinter.contracts]]
name = "Capas de cada módulo: api -> application -> infrastructure -> domain"
type = "layers"
# Una capa puede usar las de abajo, nunca las de arriba.
layers = ["api", "application", "infrastructure", "domain"]
containers = [
    "mavic.modules.identity",
    "mavic.modules.portfolio",
    "mavic.modules.negotiation",
    "mavic.modules.voice",
]

[[tool.importlinter.contracts]]
name = "Los endpoints no tocan la base directamente (pasan por application)"
type = "forbidden"
source_modules = ["mavic.modules.*.api"]
forbidden_modules = ["mavic.modules.*.infrastructure", "sqlalchemy"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "El dominio no depende de frameworks ni de la base de datos"
type = "forbidden"
source_modules = ["mavic.modules.*.domain"]
forbidden_modules = ["fastapi", "starlette", "sqlalchemy", "pydantic"]

[[tool.importlinter.contracts]]
name = "Los casos de uso no dependen de HTTP"
type = "forbidden"
source_modules = ["mavic.modules.*.application"]
forbidden_modules = ["fastapi", "starlette", "mavic.api"]

[[tool.importlinter.contracts]]
name = "De identidad, los otros módulos solo usan el dominio (Actor, permisos)"
type = "forbidden"
source_modules = ["mavic.modules.portfolio", "mavic.modules.negotiation"]
forbidden_modules = [
    "mavic.modules.identity.api",
    "mavic.modules.identity.application",
    "mavic.modules.identity.infrastructure",
]
# Indirectamente sí (a través de mavic.api.deps, que arma la sesión del request).
allow_indirect_imports = true

# Dependencias entre módulos de negocio, en un solo sentido:
#
#     voice ──> negotiation ──> portfolio ──> identity (solo dominio)
#       └──────────────────────────────────────> identity (casos de uso: nombre de la empresa)
#
# La negociación pide los casos a la cartera por sus casos de uso públicos
# (application), nunca leyendo sus tablas. La cartera no sabe que la negociación existe.
[[tool.importlinter.contracts]]
name = "La cartera no depende de la negociación"
type = "forbidden"
source_modules = ["mavic.modules.portfolio"]
forbidden_modules = ["mavic.modules.negotiation"]

[[tool.importlinter.contracts]]
name = "La negociación usa la cartera solo a través de sus casos de uso"
type = "forbidden"
source_modules = ["mavic.modules.negotiation"]
forbidden_modules = ["mavic.modules.portfolio.api", "mavic.modules.portfolio.infrastructure"]
# Indirectamente sí: los casos de uso de la cartera usan sus propias tablas.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Ningún módulo depende del agente de voz"
type = "forbidden"
source_modules = [
    "mavic.modules.identity",
    "mavic.modules.portfolio",
    "mavic.modules.negotiation",
]
forbidden_modules = ["mavic.modules.voice"]

[[tool.importlinter.contracts]]
name = "El agente de voz usa los otros módulos solo a través de sus casos de uso"
type = "forbidden"
source_modules = ["mavic.modules.voice"]
forbidden_modules = [
    "mavic.modules.identity.api",
    "mavic.modules.identity.infrastructure",
    "mavic.modules.portfolio.api",
    "mavic.modules.portfolio.infrastructure",
    "mavic.modules.negotiation.api",
    "mavic.modules.negotiation.infrastructure",
]
allow_indirect_imports = true

# Reportes (el tablero): no tiene tablas ni reglas propias, solo junta lo que
# devuelven los casos de uso de la cartera y del agente. Por eso tiene dos capas.
[[tool.importlinter.contracts]]
name = "Reportes: api -> application"
type = "layers"
layers = ["api", "application"]
containers = ["mavic.modules.reporting"]

[[tool.importlinter.contracts]]
name = "Reportes lee los otros módulos solo a través de sus casos de uso"
type = "forbidden"
source_modules = ["mavic.modules.reporting"]
forbidden_modules = [
    "mavic.modules.identity.api",
    "mavic.modules.identity.application",
    "mavic.modules.identity.infrastructure",
    "mavic.modules.portfolio.api",
    "mavic.modules.portfolio.infrastructure",
    "mavic.modules.negotiation",
    "mavic.modules.voice.api",
    "mavic.modules.voice.infrastructure",
]
# Indirectamente sí: los casos de uso de cada módulo usan sus propias tablas.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Ningún módulo depende de los reportes"
type = "forbidden"
source_modules = [
    "mavic.modules.identity",
    "mavic.modules.portfolio",
    "mavic.modules.negotiation",
    "mavic.modules.voice",
]
forbidden_modules = ["mavic.modules.reporting"]
