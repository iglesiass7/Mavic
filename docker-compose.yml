# Levanta todo el entorno local con un solo comando:
#
#     docker compose up --build
#
# Servicios:
#   db       PostgreSQL 16 (con dos bases: mavic para la app y mavic_test para tests)
#   backend  API FastAPI en http://localhost:8000  (Swagger en /docs)
#   frontend La aplicación web en http://localhost:3000  <- la que se usa
#
# Los valores ${VAR:-defecto} toman la variable de un archivo .env en esta carpeta
# si existe; si no, usan el valor por defecto. Funciona sin crear nada.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mavic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mavic}
      POSTGRES_DB: ${POSTGRES_DB:-mavic}
    ports:
      # Expuesto en tu PC para correr los tests y mirar la base con un cliente SQL.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backend/docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # El backend espera a que este chequeo dé OK antes de arrancar.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mavic} -d ${POSTGRES_DB:-mavic}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      APP_ENV: local
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Dentro de la red de Docker la base se llama "db", no "localhost".
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mavic}:${POSTGRES_PASSWORD:-mavic}@db:5432/${POSTGRES_DB:-mavic}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      # Agente de voz: se completan en el archivo .env (ver .env.example).
      AGENT_TOOLS_TOKEN: ${AGENT_TOOLS_TOKEN:-}
      ELEVENLABS_WEBHOOK_SECRET: ${ELEVENLABS_WEBHOOK_SECRET:-}
      # Llamadas salientes por teléfono (botón "Llamar"; ver docs/agente-elevenlabs.md).
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_AGENT_ID: ${ELEVENLABS_AGENT_ID:-}
      ELEVENLABS_PHONE_NUMBER_ID: ${ELEVENLABS_PHONE_NUMBER_ID:-}
      ELEVENLABS_BRANCH_ID: ${ELEVENLABS_BRANCH_ID:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # El servidor de Next le reenvía los pedidos /api/* al backend.
        # Dentro de la red de Docker el backend se llama "backend".
        API_INTERNAL_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  # Los datos de la base sobreviven a `docker compose down`.
  # Para borrarlos y empezar de cero: `docker compose down -v`.
  db_data:
